# Optional canary publishes on each push to main (tag: canary).
# Requires repository secret NPM_TOKEN (npm granular token with Publish).
#
# Disable: remove NPM_TOKEN secret, or change `on:` to workflow_dispatch only.

name: Publish canary to npm with pnpm

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: write
  statuses: write

jobs:
  release:
    name: Release Canary
    if: ${{ secrets.NPM_TOKEN != '' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@jackmaturan"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Publish canary to npm
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./package.json').name")
          npm view "${package_name}" >/dev/null 2>&1 || {
            echo "$package_name is not on npm yet. Skipping canary publish."
            exit 0
          }
          current_latest=$(node -p "require('./package.json').version")
          IFS='.' read -r major minor patch <<<"$current_latest"
          upcoming_minor="$major.$((minor + 1)).0"
          current_canary=$(npm view "${package_name}" dist-tags.canary 2>/dev/null || true)
          if [ -z "$current_canary" ]; then
            release_version="$upcoming_minor-canary.0"
          else
            IFS='.-' read -r canary_major canary_minor canary_patch _ canary_version <<<"$current_canary"
            release_version="$canary_major.$canary_minor.$canary_patch-canary.$((canary_version + 1))"
          fi
          node -e "const fs=require('fs'); const p=require('./package.json'); p.version='$release_version'; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n')"
          # Version is bumped only for this publish; do not commit canary versions to main.
          pnpm publish --provenance --access public --tag canary --no-git-checks
          package_url="https://www.npmjs.com/package/$(node -p "encodeURIComponent(require('./package.json').name)"))/v/$release_version"
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -d "{\"body\": \"Canary published - [\`$package_name@$release_version\`]($package_url)\"}"
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\": \"success\", \"context\": \"Canary published\", \"description\": \"$package_name@$release_version\", \"target_url\": \"$package_url\"}"

  missing-token:
    name: Canary skipped (no NPM_TOKEN)
    if: ${{ secrets.NPM_TOKEN == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: |
          echo "::warning::NPM_TOKEN is not set. Add an npm publish token under Settings → Secrets → Actions to enable canary publishes."
