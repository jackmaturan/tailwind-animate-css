# Publishes @jackmaturan/tailwind-animate-css to npm when you publish a GitHub Release.
#
# Setup (one time):
# 1. npm → Access Tokens → granular token with Publish (or classic publish token)
# 2. GitHub repo → Settings → Secrets → Actions → NPM_TOKEN
# 3. Optional: Settings → Environments → "release" with required reviewers
#
# Usage: create a GitHub Release for tag vX.Y.Z matching package.json version.

name: Publish to npm

on:
  release:
    types:
      - published
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish @jackmaturan/tailwind-animate-css
    environment: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@jackmaturan"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Prepare README for npm
        run: |
          sed -i 's/\[!NOTE\]/ℹ️ **NOTE**  /g' README.md
          sed -i 's/\[!TIP\]/💡 **TIP**  /g' README.md
          sed -i 's/\[!IMPORTANT\]/❗ **IMPORTANT**  /g' README.md
          sed -i 's/\[!WARNING\]/⚠️ **WARNING**  /g' README.md
          sed -i 's/\[!CAUTION\]/⛔ **CAUTION**  /g' README.md

      - name: Verify package version matches tag
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "release" ]; then
            tag_version="${{ github.event.release.tag_name }}"
          else
            tag_version="${GITHUB_REF#refs/tags/}"
          fi
          tag_version="${tag_version#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "package.json version ($pkg_version) does not match tag ($tag_version)"
            exit 1
          fi

      - name: Publish to npm
        run: pnpm publish --provenance --access public

      - name: Job summary
        run: |
          pkg=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          {
            echo "### Published to npm"
            echo ""
            echo "- **Package:** \`$pkg@$ver\`"
            echo "- **Install:** \`npm install -D $pkg\`"
            echo "- **Page:** https://www.npmjs.com/package/$(node -p "encodeURIComponent(require('./package.json').name)")
          } >> "$GITHUB_STEP_SUMMARY"
